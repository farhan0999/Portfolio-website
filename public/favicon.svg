<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141712" />
      <stop offset="100%" stop-color="#080907" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7ff73" />
      <stop offset="100%" stop-color="#c6ff4a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#c6ff4a" stroke-width="12" stroke-opacity="0.3" />

  <!-- Subtle Radial Aura -->
  <circle cx="256" cy="256" r="180" fill="#c6ff4a" opacity="0.06" filter="url(#glow)" />

  <!-- Monogram Mark: Geometric Modern Developer MF Insignia -->
  <g id="logo-mark">
    <!-- Left Bracket < in Clean Crisp White -->
    <path d="M152 172 L88 256 L152 340" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Geometric F (Farhan) in Neon Lime with Terminal Tech Cuts -->
    <!-- Vertical Spine -->
    <path d="M208 152 L208 360" fill="none" stroke="url(#limeGrad)" stroke-width="40" stroke-linecap="round" />
    <!-- Top Bar -->
    <path d="M208 172 L324 172" fill="none" stroke="url(#limeGrad)" stroke-width="40" stroke-linecap="round" />
    <!-- Mid Crossbar -->
    <path d="M208 260 L288 260" fill="none" stroke="url(#limeGrad)" stroke-width="36" stroke-linecap="round" />

    <!-- Right Closing Bracket / Tag in Clean Crisp White -->
    <path d="M360 172 L424 256 L360 340" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Accent Dot / Dot Indicator in Signature Volt Green -->
    <circle cx="320" cy="356" r="16" fill="#c6ff4a" filter="url(#glow)" />
  </g>
</svg>
