<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b13" />
      <stop offset="50%" stop-color="#11140e" />
      <stop offset="100%" stop-color="#0a0c08" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7ff73" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#c6ff4a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8fd426" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaff9e" />
      <stop offset="35%" stop-color="#c6ff4a" />
      <stop offset="100%" stop-color="#a6f024" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container with Dual Border Aura -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14" />

  <!-- Subtle Radial Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#c6ff4a" opacity="0.08" filter="url(#glow)" />

  <!-- Monogram Mark: Perfectly Centered Developer Insignia -->
  <g id="logo-mark">
    <!-- Left Bracket < in Clean Crisp White -->
    <path d="M140 168 L80 256 L140 344" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Geometric F (Farhan) in Signature Neon Volt -->
    <!-- Vertical Spine -->
    <path d="M198 154 L198 358" fill="none" stroke="url(#limeGrad)" stroke-width="36" stroke-linecap="round" />
    <!-- Top Bar -->
    <path d="M198 174 L314 174" fill="none" stroke="url(#limeGrad)" stroke-width="36" stroke-linecap="round" />
    <!-- Mid Crossbar -->
    <path d="M198 256 L284 256" fill="none" stroke="url(#limeGrad)" stroke-width="32" stroke-linecap="round" />

    <!-- Right Closing Bracket > in Clean Crisp White -->
    <path d="M372 168 L432 256 L372 344" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
